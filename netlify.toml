[build]
  publish = "."
  functions = "netlify/functions"

[dev]
  publish = "."
  port = 8888

[functions]
  node_bundler = "esbuild"

# W4 brief calibration: GET or POST /ask/brief (netlify/functions/calibrate.js).
# GET /ask?brief=... also works; ask.js hands it to the same handler.
[[redirects]]
  from = "/ask/brief"
  to = "/.netlify/functions/calibrate"
  status = 200
  force = true

# GET /ask?q=... -> TomBot retrieval as JSON (netlify/functions/ask.js)
[[redirects]]
  from = "/ask"
  to = "/.netlify/functions/ask"
  status = 200
  force = true

# D5: count crawler fetches of the agent surfaces (netlify/functions/agent-fetch.js).
# The function logs the fetch and returns the bundled static file.
[functions."agent-fetch"]
  included_files = ["about/agent/index.html", "llms.txt"]

[[redirects]]
  from = "/about/agent/"
  to = "/.netlify/functions/agent-fetch/page"
  status = 200
  force = true

[[redirects]]
  from = "/llms.txt"
  to = "/.netlify/functions/agent-fetch/llms"
  status = 200
  force = true
