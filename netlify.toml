[build]
  publish = "."
  functions = "netlify/functions"

[dev]
  publish = "."
  port = 8888

[functions]
  node_bundler = "esbuild"

# Staging (PRD v3 section 8, R1012-3). Branch deploys and deploy previews run
# against the staging database; the NILEDB_URL for those contexts is set per
# context in Netlify (never in this file). At runtime the functions read their
# deploy context (context.deploy.context) and netlify/functions/lib/db_env.js
# refuses to connect when the database name does not match it (staging must
# contain "staging", production must be "niledb"). No operator confirmation
# anywhere. The [context.*.environment] values below are build-time only and
# are kept for scripts; they never reach a running function.
#
# Non-production deploys are never indexed: the build appends a site-wide
# X-Robots-Tag to _headers (production has no build command, so it keeps the
# committed _headers as is).
[context.production.environment]
  TOMBOT_ENV = "production"

[context.branch-deploy]
  command = "printf '\n# Staging: never indexed (netlify.toml)\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> _headers"
[context.branch-deploy.environment]
  TOMBOT_ENV = "staging"

[context.deploy-preview]
  command = "printf '\n# Preview: never indexed (netlify.toml)\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> _headers"
[context.deploy-preview.environment]
  TOMBOT_ENV = "staging"

# Local `netlify dev` is staging too: the agent side never develops against
# production. Export NILEDB_URL from .env.staging before starting it (chat.js
# keeps its own NILEDB_URL path and is unaffected).
[context.dev.environment]
  TOMBOT_ENV = "staging"

# The entry file is markdown served as text/plain: ChatGPT's web reader
# rejects text/markdown ("Markdown content isn't supported", paste-test run 2,
# 2026-10-12); every reader accepts plain text. agent-fetch sets the same
# type itself; this block covers the static file.
[[headers]]
  for = "/for-agents/start.md"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# W4 brief calibration: GET or POST /ask/brief (netlify/functions/calibrate.js).
# GET /ask?brief=... also works; ask.js hands it to the same handler.
[[redirects]]
  from = "/ask/brief"
  to = "/.netlify/functions/calibrate"
  status = 200
  force = true

# GET /ask?q=... -> TomBot retrieval as JSON (netlify/functions/ask.js)
[[redirects]]
  from = "/ask"
  to = "/.netlify/functions/ask"
  status = 200
  force = true

# D5: count crawler fetches of the agent surfaces (netlify/functions/agent-fetch.js).
# The function logs the fetch and returns the bundled static file.
[functions."agent-fetch"]
  included_files = [
    "for-agents/index.html",
    "for-agents/start.md",
    "for-agents/start/index.html",
    "for-agents/wegovycare/index.html",
    "for-agents/treat-turnaround/index.html",
    "for-agents/recommendations/index.html",
    "for-agents/pages.json",
    "for-agents/proof-points.json",
    "for-agents/sends.json",
    "for-agents/fit/*/index.html",
    "for-agents/*/index.html",
    "for-agents/skills/*/index.html",
    "for-agents/shapes/*/index.html",
    "for-agents/roles/*/index.html",
    "for-agents/roles/*/*/index.html",
    "llms.txt"
  ]

# The old entry file name (N1011-1). A 301 to start.md, which the rewrite
# below then hands to agent-fetch, so the redirected fetch is counted too.
[[redirects]]
  from = "/for-agents/README.md"
  to = "/for-agents/start.md"
  status = 301
  force = true

[[redirects]]
  from = "/for-agents/"
  to = "/.netlify/functions/agent-fetch/page"
  status = 200
  force = true

[[redirects]]
  from = "/llms.txt"
  to = "/.netlify/functions/agent-fetch/llms"
  status = 200
  force = true

[[redirects]]
  from = "/for-agents/start.md"
  to = "/.netlify/functions/agent-fetch/start"
  status = 200
  force = true

# The entry file as an HTML page: the paste URL (ChatGPT's reader rejects .md).
[[redirects]]
  from = "/for-agents/start/"
  to = "/.netlify/functions/agent-fetch/start-page"
  status = 200
  force = true

# The tagged entry file: /for-agents/start/<tag>.md serves start.md and logs
# the tag (one tag per CV send, from the tracking-links skill).
[[redirects]]
  from = "/for-agents/start/*"
  to = "/.netlify/functions/agent-fetch/start/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/for-agents/wegovycare/"
  to = "/.netlify/functions/agent-fetch/wegovycare"
  status = 200
  force = true

[[redirects]]
  from = "/for-agents/treat-turnaround/"
  to = "/.netlify/functions/agent-fetch/treat-turnaround"
  status = 200
  force = true

[[redirects]]
  from = "/for-agents/recommendations/"
  to = "/.netlify/functions/agent-fetch/recommendations"
  status = 200
  force = true

# The proof points as JSON (same rows as the facts page), counted too.
[[redirects]]
  from = "/for-agents/proof-points.json"
  to = "/.netlify/functions/agent-fetch/proof-points.json"
  status = 200
  force = true

# Every other generated agent page (for-agents/pages.json, one per role or
# theme) goes through agent-fetch too, so the whole spider is counted. Last,
# so the specific rules above win.
[[redirects]]
  from = "/for-agents/*"
  to = "/.netlify/functions/agent-fetch/:splat"
  status = 200
  force = true
